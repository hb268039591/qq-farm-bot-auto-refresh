services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile.nas
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20.19.6-alpine3.21}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: qq-farm-bot:merged-20261106
    container_name: qq-farm-bot-refresh
    restart: unless-stopped
    ports:
      - "${PORT:-3007}:3007"
    volumes:
      - "${DATA_DIR:-../data}:/app/core/data"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
      - ADMIN_PORT=3007
      - FARM_DATA_DIR=/app/core/data
      - FARM_AUTO_START=${FARM_AUTO_START:-1}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3007/api/game-version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
